<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Kryveil Studios</title>
<style>
  :root{color-scheme:dark;--bg:#050000;--red:#d10b16;--red-bright:#f32632;--text:#f4eeee;--muted:#c2b8b8;--line:rgba(238,30,42,.48)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif}
  .card{width:min(420px,100%);border:1px solid var(--line);background:rgba(45,5,9,.48);padding:32px}
  .brand{margin:0 0 6px;font-size:22px;letter-spacing:.12em;font-weight:700}
  .brand span{color:var(--red-bright)}
  h1{margin:18px 0 6px;font-size:26px;font-weight:400}
  .sub{margin:0 0 22px;color:var(--muted);font-size:15px;line-height:1.5}
  label{display:block;margin:12px 0 6px;font-size:14px;color:#f1d9da}
  input{width:100%;font:inherit;color:var(--text);background:#100809;border:1px solid var(--line);border-radius:3px;padding:12px 13px}
  input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--red-bright);outline-offset:2px}
  .hidden{display:none}
  button.submit{width:100%;margin-top:20px;min-height:48px;padding:12px 24px;font:inherit;color:#fff;background:#b9000a;border:1px solid var(--red);cursor:pointer;transition:background .2s ease}
  button.submit:hover{background:var(--red)}
  button.submit:disabled{opacity:.6;cursor:wait}
  #msg{min-height:22px;margin-top:14px;font-size:14px;line-height:1.4}
  .err{color:#ff8a8f}
  .ok{color:#8fe3a8}
  .switch{margin-top:14px;font-size:14px;color:var(--muted)}
  .switch button{font:inherit;color:var(--red-bright);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
  .back{display:inline-block;margin-top:22px;font-size:14px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--text)}
</style>
</head>
<body>
<main class="card">
  <p class="brand">KRYVEIL <span>STUDIOS</span></p>
  <h1 id="title">Log in</h1>
  <p class="sub" id="sub">Welcome back. Enter your details to continue.</p>

  <div id="usernameWrap" class="hidden">
    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" maxlength="40">
  </div>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" maxlength="100">

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" maxlength="100">

  <button class="submit" id="submitBtn" type="button">Log in</button>
  <div id="msg" role="status"></div>

  <p class="switch" id="switchText">Don't have an account? <button type="button" id="switchBtn">Sign up</button></p>
  <a class="back" href="index.html">Back to website</a>
</main>

<script>
  // On localhost the page talks to the same server.
  // After deploying, replace YOUR-BACKEND-URL with your live backend address.
  var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? '' : 'https://YOUR-BACKEND-URL';

  var mode = 'login';
  var $ = function (id) { return document.getElementById(id); };

  function show(text, ok) {
    $('msg').textContent = text;
    $('msg').className = ok ? 'ok' : 'err';
  }

  function setMode(next) {
    mode = next;
    var signup = mode === 'signup';
    $('usernameWrap').classList.toggle('hidden', !signup);
    $('title').textContent = signup ? 'Create account' : 'Log in';
    $('sub').textContent = signup
      ? 'Join Kryveil Studios. It only takes a moment.'
      : 'Welcome back. Enter your details to continue.';
    $('submitBtn').textContent = signup ? 'Sign up' : 'Log in';
    $('password').setAttribute('autocomplete', signup ? 'new-password' : 'current-password');
    $('switchText').innerHTML = signup
      ? 'Already have an account? <button type="button" id="switchBtn">Log in</button>'
      : 'Don\'t have an account? <button type="button" id="switchBtn">Sign up</button>';
    $('switchBtn').addEventListener('click', function () { setMode(signup ? 'login' : 'signup'); });
    $('msg').textContent = '';
  }

  $('switchBtn').addEventListener('click', function () { setMode('signup'); });

  $('submitBtn').addEventListener('click', function () {
    var body = { email: $('email').value, password: $('password').value };
    if (mode === 'signup') body.username = $('username').value;

    $('submitBtn').disabled = true;
    show('Please wait...', true);

    fetch(API + '/api/' + mode, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      })
      .then(function (r) {
        if (!r.ok) return show(r.data.error || 'Something went wrong. Please try again.', false);

        if (mode === 'signup') {
          show(r.data.message, true);
          setTimeout(function () { setMode('login'); show('Account created. Please log in.', true); }, 1200);
        } else {
          try {
            localStorage.setItem('kryveil_token', r.data.token);
            localStorage.setItem('kryveil_user', r.data.username);
          } catch (e) {}
          show('Logged in. Redirecting...', true);
          setTimeout(function () { location.href = 'index.html'; }, 900);
        }
      })
      .catch(function () { show('Could not reach the server. Please try again later.', false); })
      .then(function () { $('submitBtn').disabled = false; });
  });
</script>
</body>
</html>
